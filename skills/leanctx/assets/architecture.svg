<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f33"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1240" height="860" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8"/>
    </pattern>
    <rect width="1240" height="860" fill="url(#grid)"/>
  </g>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(40, 36)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="13" cy="13" r="5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="25" y="17" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">ARCH-v2.0</text>

    <!-- Main Title -->
    <text x="145" y="20" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="-0.5">
      leanctx <tspan fill="#94a3b8" font-weight="400">Architecture: Universal Context Optimization &amp; Anti-Drift Engine</tspan>
    </text>
    <text x="0" y="48" fill="#64748b" font-size="13" font-weight="500">
      Multi-Harness Ingress Gating • Atomic Disk Ledger • Zero-Drift Micro-Anchoring • Post-Compaction Recovery
    </text>
  </g>

  <!-- ==================== LAYER 1: AGENT HARNESS (TOP) ==================== -->
  <g transform="translate(40, 105)" filter="url(#dropShadow)">
    <rect width="1160" height="86" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1160" height="3" fill="url(#cyanGrad)"/>

    <text x="24" y="32" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5" text-transform="uppercase">
      Execution Layer: Autonomous Coding Agent Harnesses
    </text>

    <!-- Harness Pills -->
    <g transform="translate(24, 44)">
      <!-- Antigravity -->
      <g transform="translate(0, 0)">
        <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
        <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="600">Google Antigravity</text>
        <text x="145" y="20" fill="#38bdf8" font-size="10" font-weight="700">[Hooks.json]</text>
      </g>
      <!-- Claude Code -->
      <g transform="translate(225, 0)">
        <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#a78bfa"/>
        <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="600">Claude Code</text>
        <text x="125" y="20" fill="#a78bfa" font-size="10" font-weight="700">[CLI Wrappers]</text>
      </g>
      <!-- OpenCode -->
      <g transform="translate(450, 0)">
        <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#34d399"/>
        <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="600">OpenCode Interpreter</text>
        <text x="165" y="20" fill="#34d399" font-size="10" font-weight="700">[Shim]</text>
      </g>
      <!-- Codex / OpenAI -->
      <g transform="translate(675, 0)">
        <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#fbbf24"/>
        <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="600">Codex / OpenAI Agents</text>
        <text x="175" y="20" fill="#fbbf24" font-size="10" font-weight="700">[Exec]</text>
      </g>
      <!-- Pi Agent -->
      <g transform="translate(900, 0)">
        <rect width="210" height="32" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
        <circle cx="16" cy="16" r="4" fill="#f43f5e"/>
        <text x="28" y="20" fill="#f1f5f9" font-size="12" font-weight="600">Pi / Universal CLI</text>
        <text x="145" y="20" fill="#f43f5e" font-size="10" font-weight="700">[Subagent]</text>
      </g>
    </g>
  </g>

  <!-- Connectors: Harness -> Ingress Gate & Micro-Anchor -->
  <path d="M 280 191 L 280 235" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowCyan)"/>
  <text x="290" y="218" fill="#38bdf8" font-size="11" font-weight="600">Tool Calls (exec, read)</text>

  <path d="M 960 235 L 960 191" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowEmerald)"/>
  <text x="760" y="218" fill="#34d399" font-size="11" font-weight="600">Micro-Anchor Reinjected (&lt;= 60 tok)</text>

  <!-- ==================== LAYER 2: INGRESS SANDBOX & CLAMPING (LEFT) ==================== -->
  <g transform="translate(40, 235)" filter="url(#dropShadow)">
    <rect width="565" height="320" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="565" height="3" fill="url(#cyanGrad)"/>

    <g transform="translate(20, 20)">
      <rect width="28" height="28" rx="6" fill="#0284c7" opacity="0.3"/>
      <text x="9" y="19" fill="#38bdf8" font-size="14" font-weight="900">⚡</text>
      <text x="38" y="19" fill="#f8fafc" font-size="15" font-weight="700">Physical Tool Ingress Sandboxing (Ranks 5–6)</text>
      <text x="0" y="44" fill="#64748b" font-size="12">Intercepts noisy commands and unbounded reads before history entry</text>
    </g>

    <!-- Sub-Box 1: lean_run.py -->
    <g transform="translate(20, 75)">
      <rect width="525" height="110" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" fill="#38bdf8" rx="2"/>
      <text x="16" y="22" fill="#38bdf8" font-size="13" font-weight="700">lean_run.py Sandbox (Commands &amp; Builds)</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#34d399">Success Output:</tspan> Clamped to tail 25 lines if total &gt; 30 lines.
      </text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#f43f5e">Failure Output:</tspan> Head 15 + Root-Cause Cluster + Tail 15 (&lt;= 65 lines).
      </text>
      <text x="16" y="78" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#fbbf24">Smart Error Discovery:</tspan> Ignores benign <tspan font-family="monospace">0 errors</tspan>; targets compiler panics.
      </text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#94a3b8">Disk Hygiene:</tspan> Raw stdout in <tspan font-family="monospace">exec_&lt;ts&gt;.log</tspan> with FIFO rotation (&lt;= 10 logs).
      </text>
    </g>

    <!-- Sub-Box 2: lean_read.py -->
    <g transform="translate(20, 195)">
      <rect width="525" height="105" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="105" fill="#0284c7" rx="2"/>
      <text x="16" y="22" fill="#38bdf8" font-size="13" font-weight="700">lean_read.py &amp; gate_tool.py (File Reads)</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#34d399">Bounded Chunking:</tspan> Line reads clamped to requested range or max 150 lines.
      </text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#f43f5e">Token-Bomb Guard:</tspan> 500 chars/line cap + mid-line continuation drain loop.
      </text>
      <text x="16" y="78" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#fbbf24">Byte Ceiling:</tspan> 24 KB physical cap prevents minified bundle context blowout.
      </text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#94a3b8">Empirical Delta:</tspan> <tspan font-weight="700" fill="#34d399">-99.05%</tspan> ingress tokens on lockfiles &amp; bundles.
      </text>
    </g>
  </g>

  <!-- ==================== LAYER 2: WORKING MEMORY & ANCHOR (RIGHT) ==================== -->
  <g transform="translate(635, 235)" filter="url(#dropShadow)">
    <rect width="565" height="320" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="0" y="0" width="565" height="3" fill="url(#emeraldGrad)"/>

    <g transform="translate(20, 20)">
      <rect width="28" height="28" rx="6" fill="#059669" opacity="0.3"/>
      <text x="8" y="19" fill="#34d399" font-size="14" font-weight="900">🛡️</text>
      <text x="38" y="19" fill="#f8fafc" font-size="15" font-weight="700">Context Memory &amp; Anti-Drift Loop (Rank 4)</text>
      <text x="0" y="44" fill="#64748b" font-size="12">Continuous token watermarking and invariant re-injection</text>
    </g>

    <!-- Sub-Box 1: Active Context Watermark -->
    <g transform="translate(20, 75)">
      <rect width="525" height="110" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="110" fill="#34d399" rx="2"/>
      <text x="16" y="22" fill="#34d399" font-size="13" font-weight="700">Conversational Working Memory (Rank 4)</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#38bdf8">Active Watermark Cap:</tspan> Capped to &lt;= 8,000 tokens (Turn 25: 6,690 tok).
      </text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#fbbf24">Cumulative Savings:</tspan> -93.02% total tokens processed across 25 turns.
      </text>
      <text x="16" y="78" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#34d399">Signal-to-Noise Ratio (SNR):</tspan> 10.2x density gain vs raw unmanaged sessions.
      </text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#94a3b8">Model Latency (TTFT):</tspan> Capped to 535 ms (vs 7,392 ms unmanaged baseline).
      </text>
    </g>

    <!-- Sub-Box 2: inject_anchor.py -->
    <g transform="translate(20, 195)">
      <rect width="525" height="105" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="105" fill="#059669" rx="2"/>
      <text x="16" y="22" fill="#34d399" font-size="13" font-weight="700">inject_anchor.py (Turn-by-Turn Micro-Anchor)</text>
      <text x="16" y="42" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#38bdf8">Budget Ceiling:</tspan> Single line &lt;= 240 chars / &lt;= 60 tokens emitted per turn.
      </text>
      <text x="16" y="60" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#fbbf24">Anchor Payload:</tspan> <tspan font-family="monospace">[leanctx-anchor] GOAL: ... | CONSTRAINTS: ... | ACTIVE: ...</tspan>
      </text>
      <text x="16" y="78" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#34d399">Zero Constraint Drift:</tspan> 100% negative constraint retention across all turns.
      </text>
      <text x="16" y="96" fill="#cbd5e1" font-size="11">
        • <tspan font-weight="700" fill="#94a3b8">Subagent Isolation:</tspan> Uninitialized subagents receive clean empty anchors.
      </text>
    </g>
  </g>

  <!-- Connectors: Ingress -> Disk Ledger -->
  <path d="M 322 555 L 322 605" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <text x="332" y="585" fill="#38bdf8" font-size="11" font-weight="600">State Updates (update_ledger.py)</text>

  <!-- Connectors: Ledger -> Micro-Anchor -->
  <path d="M 918 605 L 918 555" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
  <text x="928" y="585" fill="#34d399" font-size="11" font-weight="600">Reads State for Anchor</text>

  <!-- ==================== LAYER 3: ATOMIC LIVING STATE LEDGER (BOTTOM) ==================== -->
  <g transform="translate(40, 605)" filter="url(#dropShadow)">
    <rect width="1160" height="220" rx="12" fill="url(#cardGrad)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="0" y="0" width="1160" height="3" fill="url(#violetGrad)"/>

    <g transform="translate(24, 20)">
      <rect width="28" height="28" rx="6" fill="#7c3aed" opacity="0.3"/>
      <text x="8" y="19" fill="#a78bfa" font-size="14" font-weight="900">💾</text>
      <text x="38" y="19" fill="#f8fafc" font-size="15" font-weight="700">Atomic Living State Ledger (Ranks 1–3: Persistent Disk Store)</text>
      <text x="560" y="19" fill="#a78bfa" font-size="12" font-family="monospace">.agents/memory/LEDGER.json [Protected by .ledger.lock]</text>
    </g>

    <!-- Rank 1 Card -->
    <g transform="translate(24, 60)">
      <rect width="350" height="140" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="140" fill="#a78bfa" rx="2"/>
      <text x="16" y="24" fill="#a78bfa" font-size="13" font-weight="700">Rank 1: Root Intent &amp; Invariants</text>
      <text x="16" y="44" fill="#94a3b8" font-size="10" font-weight="700">BUDGET: &lt;= 500 TOKENS (DISK LEDGER)</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">• Primary User Acceptance Goal.</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">• Non-negotiable negative constraints.</text>
      <text x="16" y="102" fill="#cbd5e1" font-size="11">• Immutable to model drift.</text>
      <text x="16" y="120" fill="#34d399" font-size="11">• Amended ONLY via user <tspan font-family="monospace">amend-intent</tspan>.</text>
    </g>

    <!-- Rank 2 Card -->
    <g transform="translate(390, 60)">
      <rect width="360" height="140" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="140" fill="#38bdf8" rx="2"/>
      <text x="16" y="24" fill="#38bdf8" font-size="13" font-weight="700">Rank 2: Active Task &amp; Blockers</text>
      <text x="16" y="44" fill="#94a3b8" font-size="10" font-weight="700">BUDGET: &lt;= 500 TOKENS (DISK LEDGER)</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">• Current DAG Milestone ID &amp; Spec.</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">• Active unresolved blockers/errors.</text>
      <text x="16" y="102" fill="#cbd5e1" font-size="11">• Updated via <tspan font-family="monospace">ledger_tool.py set-task</tspan>.</text>
      <text x="16" y="120" fill="#38bdf8" font-size="11">• Single active execution focus at all times.</text>
    </g>

    <!-- Rank 3 Card -->
    <g transform="translate(766, 60)">
      <rect width="370" height="140" rx="8" fill="#0b1324" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="0" width="4" height="140" fill="#fbbf24" rx="2"/>
      <text x="16" y="24" fill="#fbbf24" font-size="13" font-weight="700">Rank 3: Symbols &amp; Negative Knowledge</text>
      <text x="16" y="44" fill="#94a3b8" font-size="10" font-weight="700">BUDGET: &lt;= 1,500 TOKENS (DISK LEDGER)</text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">• Exported function/class public signatures.</text>
      <text x="16" y="84" fill="#cbd5e1" font-size="11">• Preserved across repeated file edit hooks.</text>
      <text x="16" y="102" fill="#cbd5e1" font-size="11">• <tspan fill="#f43f5e" font-weight="700">Dead Ends:</tspan> Discarded paths (<tspan font-family="monospace">add-rejection</tspan>).</text>
      <text x="16" y="120" fill="#34d399" font-size="11">• Restored in 1 turn via <tspan font-family="monospace">rehydrate</tspan> (&lt;= 1,200 tok).</text>
    </g>
  </g>

  <!-- Connectors: Post-Compaction Recovery Arc -->
  <path d="M 1120 605 C 1200 480, 1200 280, 1120 191" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#arrowAmber)"/>
  <g transform="translate(1125, 380)">
    <rect width="105" height="36" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="8" y="15" fill="#fbbf24" font-size="10" font-weight="700">COMPACTION</text>
    <text x="8" y="28" fill="#cbd5e1" font-size="9">rehydrate recovery</text>
  </g>

</svg>
